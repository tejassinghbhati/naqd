" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="22" fill="#8a949a">n=369</text><rect x="24" y="571" width="16" height="16" fill="#d4764f"/><text x="50" y="584" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="19" fill="#98a2a8">UP overpriced that week</text><rect x="390" y="571" width="16" height="16" fill="#4a9ed8"/><text x="416" y="584" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="19" fill="#98a2a8">UP underpriced that week</text><text x="24" y="618" font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19" fill="#8a949a">Whole weeks run rich, then cheap. Errors are correlated in time as well as within markets,</text><text x="24" y="644" font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19" fill="#8a949a">so resampling individual markets still understates the uncertainty. The bootstrap</text><text x="24" y="670" font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19" fill="#8a949a">resamples entire weeks.</text></svg>